<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박물관 탈출 - 수학 어드벤처</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;600;700&family=Kalam:wght@400;700&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Nanum Gothic', 'Inter', sans-serif; /* 기본 폰트를 나눔고딕으로 변경, Inter는 fallback */
        background-color: #1e293b; /* slate-800 */
        color: #f1f5f9; /* slate-100 */
      }
      h1, h2, h3, .font-display {
        font-family: 'Lexend', sans-serif; /* 제목 폰트는 유지 */
      }
      .font-handwriting {
        font-family: 'Kalam', cursive; /* 손글씨 폰트 유지 (한글 지원 확인 필요, 필요시 변경) */
      }
      /* Custom scrollbar for better aesthetics with dark theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; /* slate-900 */
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; /* slate-700 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; /* slate-600 */
      }
      input[type="text"], input[type="number"] {
        background-color: #334155; /* slate-700 */
        border-color: #475569; /* slate-600 */
        color: #f1f5f9; /* slate-100 */
      }
      input[type="text"]:focus, input[type="number"]:focus {
        border-color: #38bdf8; /* sky-400 */
        ring-color: #38bdf8; /* sky-400 */
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.2.0"
  }
}
</script>
</head>
<body class="bg-slate-800 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
